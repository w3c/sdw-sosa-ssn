# Episode 6 · System capabilities: what a sensor can do, and where it survives.
#
# The appendix System-capabilities of the spec (chapter System-capabilities,
# ontology rdf/ontology/extensions/sosa-system.ttl) and its InkBird examples:
# rdf/examples/IBS-TH2-PLUS-capabilities.ttl (accuracy 0.5 °C, -40 to 60 °C,
# valid from 0 to 99 % RH), rdf/examples/InkBird-IBS-TH2-survivable-conditions.ttl
# (survives from -273 to 80 °C) and InkBird-IBS-TH2-Range.ttl (normal operating
# conditions, -40 to 60 °C). The two files describe two InkBird models (IBS-TH2
# Plus and IBS-TH2): the voice says "the InkBird" for both. The spec's example
# was kept rather than an Antarctic one, so that the identifiers on screen are
# those of files viewers can open (video/scenarios.md).
# Marks: `{do: mark, id, cue}` (video/README.md). Paths relative to data/.

narration: video/narration.yaml
cast: video/cast.yaml
slide: 6
fps: 25
actors: []
scene: video/episodes/06-system/scene.py
video: build/06-system/animation.mp4

lines:
  - pause: 4.0
    gesture: [{do: mark, id: title}]

  # --- the question
  - who: narrator
    tone: explain
    text: >-
      In Vienna, in eighteen seventy-two, how precise was the thermometer? The
      data does not say.
    gesture:
      - {do: mark, id: vienna, cue: Vienna}
      - {do: mark, id: precise, cue: precise}
      - {do: mark, id: say, cue: say}
  - who: narrator
    tone: explain
    text: >-
      Today, a sensor comes with a data sheet. Take the InkBird, a small sensor
      of temperature and humidity.
    gesture:
      - {do: mark, id: sheet, cue: sheet}
      - {do: mark, id: small, cue: small}

  # --- two things to describe
  - who: narrator
    tone: explain
    text: >-
      The System Capabilities module describes two things: what a sensor can
      do, its capabilities, and where it can work, its operating conditions.
    gesture:
      - {do: mark, id: two, cue: two}
      - {do: mark, id: capabilities, cue: capabilities}
      - {do: mark, id: conditions, cue: conditions}

  # --- the capabilities
  - who: narrator
    tone: explain
    text: >-
      Each capability is an observation. The accuracy is half a degree, and
      the sensor measures from minus forty to sixty degrees.
    gesture:
      - {do: mark, id: observation, cue: observation}
      - {do: mark, id: accuracy, cue: accuracy}
      - {do: mark, id: measures, cue: measures}
  - who: narrator
    tone: explain
    text: >-
      And the feature of interest of these observations is the sensor itself.
    gesture:
      - {do: mark, id: itself, cue: itself}
  - who: narrator
    tone: explain
    text: >-
      These figures hold only in a context: a relative humidity between zero
      and ninety-nine percent. This is their validity context.
    gesture:
      - {do: mark, id: context, cue: context}
      - {do: mark, id: humidity, cue: humidity}
      - {do: mark, id: validity, cue: validity}

  # --- the operating conditions, on a temperature scale
  - who: narrator
    tone: explain
    text: >-
      Operating conditions are observations too. They describe the environment
      in which the sensor can work.
    gesture:
      - {do: mark, id: operating, cue: Operating}
      - {do: mark, id: environment, cue: environment}
  - who: narrator
    tone: explain
    text: >-
      Between minus forty and sixty degrees, the InkBird works normally.
    gesture:
      - {do: mark, id: normally, cue: normally}
  - who: narrator
    tone: explain
    text: >-
      Up to eighty degrees, it survives, even if its operation may be impaired.
      Beyond, it is no longer serviceable.
    gesture:
      - {do: mark, id: survives, cue: survives}
      - {do: mark, id: serviceable, cue: serviceable}
  - who: narrator
    tone: explain
    text: >-
      The module also names suboptimal conditions, in which results are still
      reported, but less precise.
    gesture:
      - {do: mark, id: suboptimal, cue: suboptimal}

  # --- no new boxes
  - who: narrator
    tone: explain
    text: >-
      Capabilities and conditions are not new kinds of boxes. They are
      observations, and collections of observations. The spec gives two small
      vocabularies of their properties, as examples.
    gesture:
      - {do: mark, id: boxes, cue: boxes}
      - {do: mark, id: collections, cue: collections}
      - {do: mark, id: vocabularies, cue: vocabularies}

  # --- the Turtle
  - who: narrator
    tone: explain
    text: >-
      In Turtle, the survival range of the InkBird is a collection, with two
      members.
    gesture:
      - {do: mark, id: turtle, cue: Turtle}
      - {do: mark, id: collection, cue: collection}
      - {do: mark, id: members, cue: members}

  # --- the end
  - who: narrator
    tone: invite
    text: >-
      That was the System Capabilities module. Stay tuned for more.
    gesture:
      - {do: mark, id: module, cue: That}
      - {do: mark, id: tuned, cue: tuned}
  - pause: 4.0
    gesture: [{do: mark, id: end}]
