# Episode 3 · SOSA Sampling: an air bubble 7,530 years old, in the
# Antarctic ice.
#
# The examples from the spec: ssn/rdf/examples/bubble-provenance.ttl and
# paleo-atmosphere.ttl (chapter ModelSampleChains, "Sample chains").
# Marks: `{do: mark, id, cue}` (video/README.md). Paths relative to data/.

narration: video/narration.yaml
cast: video/cast.yaml
slide: 3
fps: 25
actors: []
scene: video/episodes/03-samples/scene.py
video: build/03-samples/animation.mp4

lines:
  - pause: 4.0
    gesture: [{do: mark, id: title}]

  # --- the planet
  - who: narrator
    tone: explain
    text: >-
      Some features of interest cannot be observed directly. The air of seven
      and a half thousand years ago is gone, except for tiny bubbles trapped in
      the ice of Antarctica.
    gesture:
      - {do: mark, id: globe, cue: Some}
      - {do: mark, id: gone, cue: gone}
      - {do: mark, id: antarctica, cue: Antarctica}
  - who: narrator
    tone: explain
    text: >-
      In April twenty seventeen, a thermal drill bores into the Antarctic ice
      sheet, at seventy-three degrees south.
    gesture:
      - {do: mark, id: april, cue: April}
      - {do: mark, id: bores, cue: bores}
      - {do: mark, id: south, cue: south}
  - who: narrator
    tone: explain
    text: >-
      It brings up an ice core.
    gesture:
      - {do: mark, id: core, cue: core}

  # --- the first sampling
  - who: narrator
    tone: explain
    text: >-
      In SOSA, the ice sheet is the feature of interest. Drilling is an act of
      sampling, the drill is the sampler, and the ice core is a sample: a piece
      that is meant to represent the ice sheet.
    gesture:
      - {do: mark, id: feature, cue: feature}
      - {do: mark, id: sampling, cue: sampling}
      - {do: mark, id: sampler, cue: sampler}
      - {do: mark, id: sample, cue: sample}
      - {do: mark, id: represent, cue: represent}

  # --- the second: the bubble
  - who: narrator
    tone: explain
    text: >-
      In January twenty eighteen, the core is cut at fifteen point two metres,
      and a single bubble of air is set free.
    gesture:
      - {do: mark, id: january, cue: January}
      - {do: mark, id: metres, cue: metres}
      - {do: mark, id: bubble, cue: bubble}
  - who: narrator
    tone: explain
    text: >-
      This second sampling has the ice core as its feature of interest, a
      person as its sampler, the depth of the cut as an input value, and the
      bubble as its result.
    gesture:
      - {do: mark, id: second, cue: second}
      - {do: mark, id: person, cue: person}
      - {do: mark, id: depth, cue: depth}
      - {do: mark, id: result, cue: result}
  - who: narrator
    tone: explain
    text: >-
      So the bubble is a sample of the ice core. But it is also a sample of the
      atmosphere, as it was when the snow fell.
    gesture:
      - {do: mark, id: ofcore, cue: core}
      - {do: mark, id: atmosphere, cue: atmosphere}
  - who: narrator
    tone: explain
    text: >-
      Down the chain, its ultimate feature of interest is still the Antarctic
      ice sheet.
    gesture:
      - {do: mark, id: ultimate, cue: ultimate}

  # --- the observations
  - who: narrator
    tone: explain
    text: >-
      Two observations are made on the bubble: the concentration of carbon
      dioxide, two hundred and forty parts per million, and the age of the air,
      seven thousand five hundred and thirty years, by radiocarbon dating.
    gesture:
      - {do: mark, id: two, cue: Two}
      - {do: mark, id: carbon, cue: carbon}
      - {do: mark, id: age, cue: age}
      - {do: mark, id: radiocarbon, cue: radiocarbon}
  - who: narrator
    tone: explain
    text: >-
      Together, they give a third observation, about the atmosphere itself:
      two hundred and forty parts per million, seven thousand five hundred and
      thirty years before nineteen fifty.
    gesture:
      - {do: mark, id: together, cue: Together}
      - {do: mark, id: itself, cue: itself}
      - {do: mark, id: before, cue: before}
  - who: narrator
    tone: explain
    text: >-
      From a hole in the ice to the air of the past, this is a chain of
      samples, and SOSA keeps every link of it.
    gesture:
      - {do: mark, id: chain, cue: chain}
      - {do: mark, id: link, cue: link}

  # --- the classes, the Turtle
  - who: narrator
    tone: explain
    text: >-
      Behind this example are a few classes of the Sampling module: sampling,
      sampler, sample, and the properties that chain them.
    gesture:
      - {do: mark, id: classes, cue: classes}
  - who: narrator
    tone: explain
    text: >-
      In Turtle, the bubble itself takes just four lines.
    gesture:
      - {do: mark, id: turtle, cue: Turtle}
      - {do: mark, id: lines, cue: lines}

  # --- the end
  - who: narrator
    tone: invite
    text: >-
      That was the Sampling module of SOSA. Stay tuned for more.
    gesture:
      - {do: mark, id: module, cue: module}
      - {do: mark, id: tuned, cue: tuned}
  - pause: 4.0
    gesture: [{do: mark, id: end}]
