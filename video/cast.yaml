# The cast of the SOSA/SSN videos: nobody on screen.
#
# The narration pipeline (narration toolkit, castfile.py) requires at
# least one character. `nobody` stands in: silent (no `voice`), it is
# never rendered, since video/narrated.sh only calls render.py to realign the
# words (--align-only). The only voice is the off-screen narrator,
# `narrator`, declared in video/narration.yaml (`voices:`).

default_actor: nobody

characters:
  nobody:
    kind: turtlebot
    first: offstage
