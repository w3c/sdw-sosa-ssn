<h3>Procedure definitions</h3>
<p>
    The SSN Ontology does not provide a detailed pattern for describing procedures.
</p>
<h4>Procedure details</h4>
<p>
    To describe 'Procedures' and their steps one can use <a href="https://www.w3.org/TR/prov-o/">Prov-o</a> or alternatively <a href="https://vocab.linkeddata.es/p-plan/index.html">p-plan</a> to define procedures in detail, as demonstrated in a <a href="https://github.com/w3c/sdw-sosa-ssn/tree/gh-pages/ssn/rdf/examples/Nigella-Lawson-brownies">recipe example</a>.
</p>
