name: Check Repository Integrity

on:
  push:
    branches:
      - "**"  # Run on all branches

jobs:
  check-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The OWL 2 DL checks run the OWL API and the HermiT reasoner, which
      # owlapy drives on a JVM.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install linked-data-python owlapy

      - name: Run repository check
        run: |
          python -m ldpy ssn/scripts/check_repository.ldpy
